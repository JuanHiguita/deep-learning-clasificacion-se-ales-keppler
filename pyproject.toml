[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transitos-kepler-dl"
version = "0.1.0"
description = "Clasificación calibrada de señales de tránsito de Kepler con una red multirrama (curso de Deep Learning)"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["comun", "temporal", "fusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["lenta: pruebas que entrenan un modelo pequeño"]
addopts = "-q -m 'not lenta'"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["S101"]
